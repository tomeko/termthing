name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v, e.g. 0.1.0)'
        required: true
        default: '0.0.0'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # CRITICAL: the terminal control lives in a git submodule.
          # Omitting this causes a "csproj not found" build error.
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            v="${GITHUB_REF_NAME#v}"
            echo "version=${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: |
          # NOTE: PublishSingleFile=true is load-bearing for the in-app updater.
          # The updater swaps a single executable file. If you ever disable
          # PublishSingleFile you MUST also rewrite UpdateInstaller to perform a
          # directory-level swap. Do NOT add --enable-compression-in-single-file
          # because it significantly increases startup time for an Avalonia GUI app.
          # Trimming is intentionally disabled — Avalonia relies on reflection.
          dotnet publish src/TermThing.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=embedded \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:AssemblyInformationalVersion=${{ steps.ver.outputs.version }} \
            -o publish/${{ matrix.rid }}

      - name: Package (zip, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver  = "${{ steps.ver.outputs.version }}"
          $rid  = "${{ matrix.rid }}"
          $name = "TermThing-${ver}-${rid}.zip"
          Compress-Archive -Path "publish/$rid/*" -DestinationPath $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$name.sha256"

      - name: Package (zip, Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ver="${{ steps.ver.outputs.version }}"
          rid="${{ matrix.rid }}"
          name="TermThing-${ver}-${rid}.zip"
          (cd publish/${rid} && zip -r "../../${name}" .)
          sha256sum "${name}" > "${name}.sha256" 2>/dev/null || \
            shasum -a 256 "${name}" > "${name}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: TermThing-${{ matrix.rid }}
          path: |
            TermThing-*.zip
            TermThing-*.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only create a GitHub Release for real version tags, not workflow_dispatch builds.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS.txt
        run: |
          mkdir -p out
          # Merge all per-file sha256 sidecars into one canonical file
          find dist -name '*.sha256' -exec cat {} + | sort > out/SHA256SUMS.txt
          find dist -type f -name '*.zip' -exec cp {} out/ \;
          echo "--- Artifacts ---"
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## macOS note
            Binaries are not notarized. After downloading, remove the quarantine flag:
            ```
            xattr -dr com.apple.quarantine /path/to/TermThing
            ```
            ## Windows note
            SmartScreen may warn on first launch until the binary accumulates download reputation.
