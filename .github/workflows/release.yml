name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v, e.g. 0.1.0)'
        required: true
        default: '0.0.0'

permissions:
  contents: write   # required to create the GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # CRITICAL: the terminal control lives in a git submodule.
          # Omitting this causes a "csproj not found" build error.
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            v="${GITHUB_REF_NAME#v}"
            echo "version=${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        shell: bash
        run: |
          # NOTE: PublishSingleFile=true is load-bearing for the in-app updater.
          # The updater swaps a single executable file. If you ever disable
          # PublishSingleFile you MUST also rewrite UpdateInstaller to perform a
          # directory-level swap. Do NOT add --enable-compression-in-single-file
          # because it significantly increases startup time for an Avalonia GUI app.
          # Trimming is intentionally disabled — Avalonia relies on reflection.
          dotnet publish src/TermThing.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=embedded \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:AssemblyInformationalVersion=${{ steps.ver.outputs.version }} \
            -o publish/${{ matrix.rid }}

      - name: Stage into termthing/ folder
        shell: bash
        run: |
          mkdir -p pkg/termthing
          cp -r "publish/${{ matrix.rid }}/." pkg/termthing/

      # Upload pkg/ (not pkg/termthing/) so the artifact stores termthing/<files>.
      # upload-artifact strips the common path prefix (pkg/), preserving the
      # termthing/ directory structure.  GitHub's artifact download wrapper then
      # produces one zip: TermThing-<ver>-<rid>.zip → termthing/<exe>.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TermThing-${{ steps.ver.outputs.version }}-${{ matrix.rid }}
          path: pkg/

  release:
    needs: build
    runs-on: ubuntu-latest
    # Only create a GitHub Release for real version tags, not workflow_dispatch builds.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      # Each artifact lands in its own subdirectory named after the artifact.
      # Directory layout after download:
      #   dist/TermThing-<ver>-<rid>/   ← one dir per platform
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package zips and build SHA256SUMS.txt
        run: |
          mkdir -p out
          for artifact_dir in dist/TermThing-*; do
            artifact_name=$(basename "$artifact_dir")   # e.g. TermThing-0.1.0-win-x64
            zipname="${artifact_name}.zip"
            # artifact_dir contains termthing/ as the top-level directory
            (cd "$artifact_dir" && zip -r "../../out/${zipname}" termthing)
            # Individual sidecar (e.g. TermThing-0.1.0-win-x64.zip.sha256)
            (cd out && sha256sum "${zipname}" > "${zipname}.sha256")
            cat "out/${zipname}.sha256" >> out/SHA256SUMS.txt
          done
          sort -o out/SHA256SUMS.txt out/SHA256SUMS.txt
          echo "--- Release artifacts ---"
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## macOS note
            Binaries are not notarized. After downloading, remove the quarantine flag:
            ```
            xattr -dr com.apple.quarantine /path/to/TermThing
            ```
            ## Windows note
            SmartScreen may warn on first launch until the binary accumulates download reputation.
